<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявки</title>
    <script src="index.js" defer></script>
</head>
<body>
    <h1>Заявки корпуса</h1>
    <label for="trouble-id">Проблема:</label>
    <input type="text" id="trouble-id">
    <label for="room-id">Место:</label>
    <input type="text" id="room-id">
    <select id="category-id">
        <option value="" hidden disabled selected>Выберите категорию</option>
        <option value="Оборудование">Оборудование</option>
        <option value="Аудитория">Аудитория</option>
        <option value="Другое">Другое</option>
    </select>
    <button id="add-button">Добавить заявку</button>
    <p id="message"></p>
    <input type="checkbox" id="showHint">
    <label for="showHint">Только открытые</label>
    <ul id="tickets-id"></ul>
</body>
</html>
